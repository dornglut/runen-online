name: RO4B temporary lock generation

on:
  push:
    branches:
      - ro4b-oidc-adapter

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ro4b-oidc-adapter
          fetch-depth: 1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Generate exact lockfile
        run: cargo +stable generate-lockfile
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "RO4B: resolve adapter dependency lockfile"
          git push origin HEAD:ro4b-oidc-adapter
